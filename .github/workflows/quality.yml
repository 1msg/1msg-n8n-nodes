name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.9'
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tools/quality --ignore-workspace install --lockfile-dir "$PWD/quality/tooling" --frozen-lockfile --ignore-scripts
      - run: pnpm run test:preset
      - run: pnpm run quality:guards
      - run: pnpm run format:check
      - run: pnpm run lint:static
      - run: pnpm run lint:typed
      - run: pnpm run lint:framework
      - run: pnpm run typecheck
      - run: pnpm run lint:arch
      - run: pnpm run lint:unused:production
      - run: pnpm run lint:unused:full
      - run: pnpm run lint:duplicates
      - run: pnpm run lint:duplicates:full
      - run: pnpm run lint:complexity
      - run: pnpm run test:quality
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run test:pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: quality/reports/
          if-no-files-found: error
  package-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Legacy hosts provide a compatible workflow peer; latest n8n requires Node 22.
          - node: '20'
            peer: 'n8n-workflow@1.117.1'
          - node: '22'
            peer: 'n8n-workflow@latest'
          - node: '24'
            peer: 'n8n-workflow@latest'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.9'
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - name: Pack the actual distributable
        run: mkdir -p "$RUNNER_TEMP/packed" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/packed"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bash scripts/consumer-smoke.sh "$RUNNER_TEMP"/packed/*.tgz '@1msg/n8n-nodes-1msg' '${{ matrix.peer }}'
  quality-required:
    if: always()
    needs: [checks, package-consumer]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const jobs=JSON.parse(process.env.RESULTS); if(!Object.values(jobs).every(job=>job.result==="success")) process.exit(1)'
