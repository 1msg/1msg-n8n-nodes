# Existing npm trust: 1msg/1msg-n8n-nodes / publish.yml.
# Tags publish with OIDC and provenance; manual dispatch only rehearses the release.
name: Publish

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: publish-npm-1msg-n8n-nodes
  cancel-in-progress: false

jobs:
  publish:
    name: Publish or rehearse npm release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify merged source and release metadata
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(manifest.packageManager, 'pnpm@10.34.9');
          assert.equal(manifest.name, '@1msg/n8n-nodes-1msg');
          assert.equal(manifest.repository.url, 'git+https://github.com/1msg/1msg-n8n-nodes.git');
          assert.match(manifest.version, /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/);
          assert.ok(!manifest.publishConfig?.registry || manifest.publishConfig.registry.replace(/\/$/, '') === 'https://registry.npmjs.org');
          if (process.env.GITHUB_REF_TYPE === 'tag') assert.equal(process.env.GITHUB_REF_NAME, manifest.version);
          else assert.equal(process.env.GITHUB_REF, 'refs/heads/main');
          NODE
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.9'
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - name: Use the pinned npm version with OIDC support
        run: npm install --global npm@11.19.1 --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate framework lint, build and packed entrypoints
        run: |
          pnpm run lint
          pnpm run build
          pnpm run test:pack
      - name: Rehearse packing without changing the registry
        if: github.event_name == 'workflow_dispatch'
        run: npm pack --ignore-scripts --dry-run
      - name: Release with the existing n8n lint/build/provenance checks
        if: github.event_name == 'push'
        run: pnpm run release
