# Publishes this n8n community node to npm when a version tag is pushed.
# n8n requires GitHub Actions provenance for verification after 1 May 2026.
#
# Trusted publishing: on npmjs.com, add this GitHub workflow as a trusted
# publisher (publish.yml) and leave NPM_TOKEN unset.
# Token fallback: set the NPM_TOKEN repository secret.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify release tag and package versions
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(process.env.GITHUB_REF_TYPE, 'tag', 'Publishing requires a version tag');
          assert.equal(process.env.GITHUB_REF_NAME, manifest.version, 'Tag must equal package.json version');
          assert.equal(lock.version, manifest.version, 'Lockfile version must match package.json');
          assert.equal(lock.packages[''].version, manifest.version, 'Lockfile root package must match package.json');
          NODE
      - name: Release
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
