# Publishes this n8n community node to npm when a version tag is pushed.
# n8n requires GitHub Actions provenance for verification after 1 May 2026.
#
# Trusted publishing: on npmjs.com, add this GitHub workflow as a trusted
# publisher (publish.yml) and leave NPM_TOKEN unset.
# Token fallback: set the NPM_TOKEN repository secret.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Release
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
